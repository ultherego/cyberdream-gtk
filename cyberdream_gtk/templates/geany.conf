# GENERATED by cyberdream-gtk from palette.toml and roles.toml.
# Do not edit; change the sources and rebuild.
# Only opaque colors here (use mix, not alpha): Geany needs #rrggbb.

[theme_info]
name=Cyberdream
description=Cyberdream colors for Geany
version=1
author=cyberdream-gtk
compat=1.22;1.23;1.23.1;1.24

[named_styles]

default={{text}};{{view_bg}};false;false
error={{error}};;;true

# Editor
selection=;{{mix(view_bg, accent, 0.3)}};;true
current_line=;{{raised_bg}};true
brace_good={{accent}};{{mix(view_bg, accent, 0.2)}};true
brace_bad={{error}};{{raised_bg}};true
margin_line_number={{muted}};{{view_bg}}
margin_folding={{muted}};{{view_bg}}
fold_symbol_highlight={{border}}
indent_guide={{border}}
caret={{accent}}
marker_line={{on_accent}};{{yellow}}
marker_search=;{{yellow}}
marker_mark={{on_accent}};{{blue}}
call_tips={{text}};{{raised_bg}};true;true
white_space={{border}};;true

# Programming languages
comment={{muted}};;;true
comment_doc={{muted}};;;true
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword={{cyan}};;;true
comment_doc_keyword_error={{error}};;;true

number={{orange}}
number_1=number
number_2=number_1

type={{magenta}}
class=type
function={{blue}}
parameter={{text}}

keyword={{orange}}
keyword_1=keyword
keyword_2={{magenta}}
keyword_3={{cyan}}
keyword_4=keyword_1

identifier=default
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

string={{green}}
string_1=string
string_2={{pink}}
string_3=default
string_4=default
string_eol=string_1,italic
character=string_1
backticks=string_2
here_doc=string_1

scalar={{cyan}}
label=default,bold
preprocessor={{cyan}}
regex={{pink}}
operator={{magenta}}
decorator={{cyan}}
other=default

# Markup-type languages
tag={{blue}}
tag_unknown=tag
tag_end=tag
attribute={{orange}}
attribute_unknown=attribute
value={{green}}
entity={{pink}}

# Diff
line_added={{green}}
line_removed={{red}}
line_changed={{yellow}}
